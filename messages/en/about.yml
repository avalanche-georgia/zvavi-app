about:
  meetTheTeam: 'Meet the team'
  lede: 'We offer free, high-quality risk assessments to help backcountry riders and ski tourers make safer decisions in the Georgian backcountry.'

  sections:
    who: 'Who we are'
    what: 'What we do'
    responsibility: 'Forecasts are guidance'
    next: 'Get involved'

  content:
    who: '<b>Zvavi Saqartvelo</b> – Avalanche Georgia is a volunteer-run, registered non-profit NGO providing public avalanche forecasts in Georgia’s mountain regions.'
    what: 'The project is driven by the time, effort, and expertise of professionals, mountain enthusiasts, and local contributors. Our goal is to raise awareness, improve safety, and support a culture of informed decision-making in the mountains. Alongside the forecasts, we offer <b>avalanche safety courses</b> and educational materials to help users better understand snowpack conditions and risks.'
    responsibility: 'Our forecasters are internationally certified, and observations come from trained local experts. Still, every forecast is a best guess based on available data — real conditions may differ. Please make your own observations and decisions in the field. <b>We cannot be held responsible</b> for any actions taken in the backcountry that may result in injury, loss, or death.'
    next: 'Volunteer, donate or get in touch — every bit helps keep the forecasts free.'
