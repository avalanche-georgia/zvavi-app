about:
  lede: 'ჩვენ ვთავაზობთ უფასო, მაღალი ხარისხის რისკის შეფასებებს, რათა ბექქანთრის სრიალისა და სკიტურის მოყვარულებმა საქართველოს ბექქანთრში უფრო უსაფრთხო გადაწყვეტილებები მიიღონ.'

  sections:
    who: 'ვინ ვართ'
    what: 'რას ვაკეთებთ'
    responsibility: 'პროგნოზი რეკომენდაციაა'
    next: 'ჩაერთეთ'

  content:
    who: '<b>ზვავი საქართველო</b> — არის მოხალისეებზე დაფუძნებული, დარეგისტრირებული არაკომერციული ორგანიზაცია, რომელიც ამზადებს საზოგადოებრივ ზვავის პროგნოზებს საქართველოს მთიან რეგიონებში.'
    what: 'პროექტს ამოძრავებს პროფესიონალების, მთის ენთუზიასტებისა და ადგილობრივი მონაწილეების დრო, ძალისხმევა და ექსპერტიზა. ჩვენი მიზანია ცნობიერების ამაღლება, უსაფრთხოების გაუმჯობესება და ინფორმირებულ გადაწყვეტილებებზე დაფუძნებული კულტურის მხარდაჭერა. პროგნოზებთან ერთად ვთავაზობთ <b>ზვავის უსაფრთხოების კურსებს</b> და საგანმანათლებლო მასალებს, რათა მომხმარებლებმა უკეთ გაიგონ თოვლის საფარის მდგომარეობა და რისკები.'
    responsibility: 'ჩვენი პროგნოზისტები საერთაშორისო სერტიფიკატებით არიან, ხოლო დაკვირვებებს ამზადებენ გადამზადებული ადგილობრივი სპეციალისტები. მიუხედავად ამისა, თითოეული პროგნოზი საუკეთესო შეფასებაა ხელმისაწვდომ მონაცემებზე დაყრდნობით — რეალური პირობები შეიძლება განსხვავდებოდეს. გთხოვთ ადგილზე თავად გააკეთოთ დაკვირვებები და მიიღოთ გადაწყვეტილებები. <b>ჩვენ ვერ ვიღებთ პასუხისმგებლობას</b> ბექქანთრში მიღებული ქმედებებისა და შესაძლო დაზიანებების, დანაკარგის ან სიკვდილის გამო.'
    next: 'გახდით მოხალისე, გააკეთეთ შემოწირულობა ან დაგვიკავშირდით — ყოველი წვლილი პროგნოზებს უფასოს ტოვებს.'
