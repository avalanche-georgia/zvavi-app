seo:
  about:
    title: 'ჩვენს შესახებ'
    description: 'გაიგეთ მეტი Avalanche Georgia-ს შესახებ — ზვავის პროგნოზი და უსაფრთხოების ინფორმაცია საქართველოს მთიანი რეგიონებისთვის.'
  contact:
    title: 'კონტაქტი'
    description: 'დაუკავშირდით Avalanche Georgia-ს გუნდს. მოგვაწოდეთ დაკვირვებები, დასვით კითხვები ან გამოხმაურება.'
  currentForecast:
    title: 'მიმდინარე ზვავის პროგნოზი — {regionName}'
    description: 'უახლესი ზვავის პროგნოზი — {regionName}. შეამოწმეთ საფრთხის დონე და თოვლის პირობები.'
  forecast:
    title: '{regionName} — ზვავის პროგნოზი {validUntil}: {levelName}'
    description: 'ზვავის პროგნოზი — {regionName}, მოქმედებს {validUntil}-მდე. საერთო საშიშროება: {levelName}.'
  forecastUndated:
    title: '{regionName} — ზვავის პროგნოზი: {levelName}'
    description: 'ზვავის პროგნოზი — {regionName}. საერთო საშიშროება: {levelName}.'
  forecastArea:
