    description: 'ზვავის პროგნოზის ზონის რუკა — {regionName}.'

  history:
    title: 'პროგნოზების არქივი — {regionName}'
    description: '{regionName}: ზვავის ყველა გამოქვეყნებული პროგნოზი, სეზონების მიხედვით.'
  joinUs:
    title: 'შემოგვიერთდით'
