    description: 'შეატყობინეთ ჩვენს პროგნოზისტებს ზვავის ან არასტაბილურობის ნიშნების შესახებ — {regionName}.'
  partners:
    title: 'პარტნიორები'
    description: 'ჩვენი პარტნიორები, რომლებიც საქართველოში ზვავის პროგნოზირებას შესაძლებელს ხდიან.'
  privacy:
    title: 'კონფიდენციალურობის პოლიტიკა'
    description: 'გაიგეთ, როგორ აგროვებს, იყენებს და იცავს Avalanche Georgia თქვენს პირად მონაცემებს.'
